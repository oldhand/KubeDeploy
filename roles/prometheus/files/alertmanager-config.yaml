global:
  resolve_timeout: 5m
  # 邮件配置（QQ邮箱）
  smtp_auth_username: 68594864@qq.com
  smtp_auth_password: ihpyiwqaoyedcaca  # 建议使用QQ邮箱授权码而非密码
  smtp_require_tls: true  # 465端口需开启TLS
  smtp_smarthost: smtp.qq.com:465
  smtp_from: 68594864@qq.com

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook.prometheusalert'  # 默认转发到PrometheusAlert
  # 子路由：可根据标签分发到不同接收器（如邮件）
  routes:
    - match:
        severity: 'critical'  # 严重级别告警同时发送邮件
      receiver: 'email-notify'

receivers:
  # 1. 转发到PrometheusAlert的接收器
  - name: 'web.hook.prometheusalert'
    webhook_configs:
      - url: 'http://prometheus-alert-center:8080/prometheus/alert'  # 确保Service名称和命名空间正确
        send_resolved: true

  # 2. 邮件通知接收器
  - name: 'email-notify'
    email_configs:
      - send_resolved: true
        to: tezan@qq.com

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'dev', 'instance']
