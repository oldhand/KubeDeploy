---
- name: 创建 Grafana 数据源
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: grafana-datasources
        namespace: prometheus
      data:
        prometheus.yml: |
          apiVersion: 1
          datasources:
          - name: Prometheus
            type: prometheus
            url: http://prometheus:9090
            access: proxy
            isDefault: true
  run_once: true


- name: 清理 /data/grafana 下的所有文件和子目录
  ansible.builtin.file:
    path: /data/grafana
    state: absent
  run_once: true


- name: 创建 Grafana 存储目录(/data/grafana)
  ansible.builtin.file:
    path: /data/grafana
    state: directory
    mode: '0777'
    recurse: yes
  run_once: true


- name: 创建Grafana存储类
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: grafana-storage
      provisioner: kubernetes.io/no-provisioner
      volumeBindingMode: Immediate
      reclaimPolicy: Retain
  run_once: true


- name: 创建Grafana持久化存储
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolume
      metadata:
        name: grafana-pv
        labels:
          app: grafana
      spec:
        capacity:
          storage: 10Gi
        accessModes:
          - ReadWriteOnce
        storageClassName: grafana-storage
        hostPath:
          path: /data/grafana
          type: DirectoryOrCreate
        persistentVolumeReclaimPolicy: Retain
  run_once: true

- name: 创建Grafana持久化存储声明
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: grafana-pvc
        namespace: prometheus
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: grafana-storage
  run_once: true

- name: 创建 grafana-custom-config
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: grafana-custom-config
        namespace: prometheus
      data:
        grafana.ini: |
          [security]
          x_frame_options = ALLOWALL
          allow_embedding = true
          content_security_policy = frame-ancestors *; default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;
  run_once: true

- name: 部署Grafana
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: grafana
        namespace: prometheus
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: grafana
        template:
          metadata:
            labels:
              app: grafana
          spec:
            securityContext:
              runAsUser: 0          # 使用root用户运行容器
              fsGroup: 472          # Grafana默认用户组ID
              runAsGroup: 472
            tolerations:
              - key: "node-role.kubernetes.io/control-plane"
                operator: "Exists"
                effect: "NoSchedule"
              - key: "node-role.kubernetes.io/master"
                operator: "Exists"
                effect: "NoSchedule"
            containers:
              - name: grafana
                image: grafana/grafana:12.2
                imagePullPolicy: Never
                ports:
                  - containerPort: 3000
                volumeMounts:
                  - name: grafana-datasources
                    mountPath: /etc/grafana/provisioning/datasources
                  - name: grafana-storage  # 新增存储挂载
                    mountPath: /var/lib/grafana  # Grafana数据存储路径
                  - name: grafana-custom-config
                    mountPath: /etc/grafana/grafana.ini
                    subPath: grafana.ini
                env:
                  - name: SERVICE_HOST
                    valueFrom:
                      fieldRef:
                        fieldPath: status.hostIP  # 节点IP（非Service IP，局限性大）
                  - name: GF_SECURITY_ADMIN_USER
                    value: "admin"  # 固定用户名
                  - name: GF_SECURITY_ADMIN_PASSWORD
                    value: "admin"  # 固定密码
                  - name: GF_USERS_ALLOW_SIGN_UP
                    value: "false"
                  - name: GF_LANG
                    value: "zh-CN"  # 中文界面
                  # 允许嵌入配置
                  - name: GF_SERVER_ALLOW_EMBEDDING
                    value: "true"
                  - name: GF_HTTP_CORS_ENABLED
                    value: "true"
                  - name: GF_HTTP_CORS_ALLOW_ORIGIN
                    value: "*"
                  # 允许嵌入的域名/IP
                  - name: GF_SERVER_ALLOWED_EMBEDDING_DOMAINS
                    value: "*"
                  - name: GF_SERVER_ROOT_URL
                    value: "http://$(SERVICE_HOST):30093/"
                  - name: GF_USERS_VIEWERS_CAN_EDIT
                    value: "false"  # 确保观众无编辑权限（避免显示编辑按钮）
                  - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
                    value: ""  # 可选：清空默认首页，不影响嵌入但减少干扰
                  - name: GF_DASHBOARDS_PERMISSIONS_ENABLE_READ_FOLDER
                    value: "true"
                  - name: GF_DASHBOARDS_VIEWERS_CAN_MANAGE_VARIABLES
                    value: "true"
                  - name: GF_AUTH_ANONYMOUS_ENABLED
                    value: "true"
                  - name: GF_AUTH_ANONYMOUS_ORG_ROLE
                    value: "Viewer"
                  - name: GF_SECURITY_X_FRAME_OPTIONS
                    value: "ALLOWALL"
                  - name: GF_SECURITY_CONTENT_SECURITY_POLICY
                    value: "frame-ancestors *; default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;"
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi
            volumes:
              - name: grafana-datasources
                configMap:
                  name: grafana-datasources
              - name: grafana-storage
                persistentVolumeClaim:
                  claimName: grafana-pvc
              - name: grafana-custom-config
                configMap:
                  name: grafana-custom-config
  run_once: true

- name: 创建 Grafana NodePort (30093) 服务
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: grafana
        namespace: prometheus
      spec:
        selector:
          app: grafana
        ports:
          - port: 3000
            targetPort: 3000
            nodePort: 30093
        type: NodePort
  run_once: true