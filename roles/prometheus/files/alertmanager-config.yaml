global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook.kubeadmin'
  routes:
    - receiver: 'web.hook.prometheusalert'
      continue: true

    - receiver: 'web.hook.kubeadmin'

receivers:
  # 1. 转发到PrometheusAlert的接收器
  - name: 'web.hook.prometheusalert'
    webhook_configs:
      - url: 'http://prometheus-alert-center:8080/prometheus/alert'  # 确保Service名称和命名空间正确
        send_resolved: true

  - name: 'web.hook.kubeadmin'
    webhook_configs:
      - url: 'http://kubeadmin-headless.kube.svc.cluster.local:8080/api/kube_alert_webhook'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'dev', 'instance']
