# alert_rules.yml - Prometheus告警规则配置
# 适用场景：通用服务器、Kubernetes集群基础监控
# 依赖组件：node_exporter、kube-state-metrics、Prometheus自身指标

groups:
  # 1. 实例存活监控（基础可用性）
  - name: instance_availability
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "监控实例 {{ $labels.instance }} 宕机"
          description: "{{ $labels.job }} 任务下的 {{ $labels.instance }} 已停止响应超过5分钟（当前状态：不可达）"
          value: "当前值: {{ $value }}"

  # 2. 主机资源使用率监控（CPU/内存/磁盘/网络）- 补全expr+修正模板语法
  - name: host_resource_usage
    rules:
      # CPU使用率过高
      - alert: HighCPUUsage
        expr: 100 - (avg(irate(node_cpu_seconds_total{mode="idle"}[1m])) by (instance) * 100) > 80
        for: 5m
        labels:
          severity: warning
          category: resource
        annotations:
          summary: "实例 {{ $labels.instance }} CPU使用率过高"
          description: "CPU使用率已超过80%，持续5分钟（当前值：{{ printf \"%.2f%%\" $value }}）"
          value: "{{ printf \"%.2f%%\" $value }}"

      # 内存使用率过高
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
          category: resource
        annotations:
          summary: "实例 {{ $labels.instance }} 内存使用率过高"
          description: "内存使用率已超过85%，持续5分钟（当前值：{{ printf \"%.2f%%\" $value }}）"
          value: "{{ printf \"%.2f%%\" $value }}"

      # 根分区磁盘使用率过高
      - alert: HighRootDiskUsage
        expr: 100 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} * 100) > 85
        for: 2m
        labels:
          severity: warning
          category: resource
        annotations:
          summary: "实例 {{ $labels.instance }} 根分区磁盘使用率过高"
          description: "根分区使用率已超过85%，持续2分钟（当前值：{{ printf \"%.2f%%\" $value }}）"
          value: "{{ printf \"%.2f%%\" $value }}"

      # 根分区剩余空间不足（修正除法空格）
      - alert: LowRootDiskSpace
        # expr中提前转换单位：字节 → GB（除以1024^3），判断是否小于10GB
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / 1073741824) < 10
        for: 2m
        labels:
          severity: critical
          category: resource
        annotations:
          summary: "实例 {{ $labels.instance }} 根分区剩余空间不足"
          description: "根分区剩余空间已低于10GB，持续2分钟（当前值：{{ printf \"%.2f GB\" $value }}）"
          value: "{{ printf \"%.2f GB\" $value }}"


      - alert: HighNetworkTraffic
        # 假设监控网卡流量（字节/秒），转换为MB/秒（除以1024^2 = 1048576）
        expr: (node_network_transmit_bytes_total{device!~"lo"} / 1048576) > 50  # 假设阈值50MB/s
        for: 2m
        labels:
          severity: warning
          category: network
        annotations:
          summary: "实例 {{ $labels.instance }} 网络流量过高"
          description: "网络发送流量已超过50MB/s，持续2分钟（当前值：{{ printf \"%.2f MB/s\" $value }}）"
          value: "{{ printf \"%.2f MB/s\" $value }}"


  # 3. Kubernetes容器/Pod监控
  - name: k8s_container_pod
    rules:
      # Pod频繁重启
      - alert: PodFrequentRestart
        expr: sum(increase(kube_pod_container_status_restarts_total[10m])) by (pod, namespace) > 3
        for: 1m
        labels:
          severity: warning
          category: k8s
        annotations:
          summary: "命名空间 {{ $labels.namespace }} 中Pod {{ $labels.pod }} 频繁重启"
          description: "10分钟内重启次数超过3次（当前值：{{ $value }}次），可能存在程序异常"
          value: "{{ $value }}次"

      # 容器状态异常（非Running状态）
      - alert: ContainerNotRunning
        expr: kube_pod_container_status_running{namespace!~"kube-system|monitoring"} != 1  # 过滤系统命名空间
        for: 3m
        labels:
          severity: critical
          category: k8s
        annotations:
          summary: "命名空间 {{ $labels.namespace }} 中Pod {{ $labels.pod }} 的容器 {{ $labels.container }} 未运行"
          description: "容器状态异常（非Running），持续3分钟，可能影响服务可用性"

  # 4. 监控系统自身健康度（补全expr）
  - name: monitoring_system_health
    rules:
      # Prometheus存储容量不足
      - alert: PrometheusStorageLow
        expr: prometheus_tsdb_storage_blocks_bytes / prometheus_tsdb_storage_retention_bytes * 100 > 80
        for: 10m
        labels:
          severity: warning
          category: monitoring
        annotations:
          summary: "Prometheus 存储容量不足"
          description: "存储已使用超过80%（当前值：{{ printf \"%.2f%%\" $value }}），建议扩展存储或缩短保留时间"
          value: "{{ printf \"%.2f%%\" $value }}"

  # 5. MySQL数据库监控（依赖mysqld_exporter）
  - name: mysql_database
    rules:
      # InnoDB当前行锁等待告警
      - alert: MySQLInnoDBRowLockWait
        expr: mysql_global_status_innodb_row_lock_current_waits > 0
        for: 3m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "MySQL实例 {{ $labels.instance }} 存在InnoDB行锁等待"
          description: "InnoDB当前行锁等待数大于0，已持续3分钟，可能导致事务阻塞（当前等待数：{{ $value }}）"
          value: "当前行锁等待数: {{ $value }}"

      # MySQL Exporter采集器失败告警
      - alert: MySQLExporterCollectorFailed
        expr: mysql_exporter_collector_success == 0
        for: 2m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "MySQL实例 {{ $labels.instance }} 采集器执行失败"
          description: "采集器 {{ $labels.collector }} 执行失败，已持续2分钟，可能导致监控数据缺失"
          value: "失败采集器: {{ $labels.collector }}"

      # MySQL失败连接数激增告警
      - alert: MySQLAbortedConnectsSurge
        expr: rate(mysql_global_status_aborted_connects[5m]) > 5
        for: 3m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "MySQL实例 {{ $labels.instance }} 失败连接数激增"
          description: "5分钟内失败连接增长率超过5个/秒，已持续3分钟（当前速率：{{ printf \"%.2f/s\" $value }}）"
          value: "失败连接增长率: {{ printf \"%.2f/s\" $value }}"

      # InnoDB Buffer Pool无空闲页告警
      - alert: MySQLInnoDBCacheWaitFree
        expr: mysql_global_status_innodb_buffer_pool_wait_free > 0
        for: 2m
        labels:
          severity: critical
          category: database
        annotations:
          summary: "MySQL实例 {{ $labels.instance }} InnoDB Buffer Pool资源不足"
          description: "Buffer Pool无空闲页，需等待脏页刷盘，已持续2分钟（等待次数：{{ $value }}），会导致IO性能下降"
          value: "Buffer Pool等待空闲页次数: {{ $value }}"

      # MySQL表锁等待告警
      - alert: MySQLTableLockWaited
        expr: increase(mysql_global_status_table_locks_waited[5m]) > 0
        for: 3m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "MySQL实例 {{ $labels.instance }} 存在表锁等待"
          description: "5分钟内新增表锁等待，已持续3分钟（新增等待次数：{{ printf \"%.0f\" $value }}），表锁会阻塞并发读写"
          value: "5分钟新增表锁等待次数: {{ printf \"%.0f\" $value }}"

      # MySQL连接错误（peer_address类型）告警
      - alert: MySQLConnectionPeerError
        expr: rate(mysql_global_status_connection_errors_total{error="peer_address"}[5m]) > 2
        for: 3m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "MySQL实例 {{ $labels.instance }} peer_address连接错误激增"
          description: "5分钟内peer_address类型连接错误超过2个/秒，已持续3分钟（当前速率：{{ printf \"%.2f/s\" $value }}）"
          value: "peer_address错误增长率: {{ printf \"%.2f/s\" $value }}"

      # InnoDB日志写入等待告警
      - alert: MySQLInnoDBLogWait
        expr: mysql_global_status_innodb_log_waits > 0
        for: 2m
        labels:
          severity: critical
          category: database
        annotations:
          summary: "MySQL实例 {{ $labels.instance }} InnoDB日志写入等待"
          description: "InnoDB日志等待数大于0，已持续2分钟（等待次数：{{ $value }}），可能因日志缓冲区不足导致事务延迟"
          value: "InnoDB日志等待次数: {{ $value }}"


  # 6. 关键进程监控（依赖process_exporter）
  - name: named-process-alerts
    rules:
      # 1. CPU使用率过高
      - alert: ProcessGroupCpuHighUsage
        expr: |
          sum(rate(namedprocess_namegroup_cpu_seconds_total{mode=~"user|system"}[5m])) by (groupname) > 0.8
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.groupname }} CPU使用率过高"
          # 修复：移除注解中的rate函数，改用$value展示计算结果（expr已计算rate）
          description: "5分钟内CPU平均使用率{{ $value | humanizePercentage }}，已超过80%阈值。建议检查进程是否有异常计算逻辑"
          suggestion: "通过`kubectl top pod -n <命名空间>`查看实时CPU消耗，排查是否有死循环或频繁GC"

      # 2. 物理内存使用率过高
      - alert: ProcessGroupMemoryHighUsage
        expr: |
          (namedprocess_namegroup_memory_bytes{memtype="resident"} / on() node_memory_Available_bytes * 100 > 90) 
          or 
          (namedprocess_namegroup_memory_bytes{memtype="resident", groupname=~"kube-apiserver|prometheus-server"} > 1e9)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.groupname }} 物理内存使用率过高"
          description: "当前物理内存使用{{ $value | humanize }}字节，占节点可用内存比例过高，已接近系统上限"
          suggestion: "检查是否存在内存泄漏（如`kubectl exec <pod名> -n <命名空间> -- go tool pprof -inuse_space <进程PID>`）"


      # 3. 线程数突增
      - alert: ProcessGroupThreadSurge
        expr:
          namedprocess_namegroup_num_threads > 50
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.groupname }} 线程数异常激增"
          description: "当前线程数{{ $value }}，远超正常范围（正常≤26），可能存在线程泄漏"
          suggestion: "通过`kubectl exec <pod名> -n <命名空间> -- pstack <进程PID>`查看线程栈"

      # 4. 文件描述符接近上限
      - alert: ProcessGroupFdNearLimit
        expr: |
          namedprocess_namegroup_open_filedesc / process_max_fds > 0.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.groupname }} 文件描述符即将耗尽"
          # 修复：移除错误的函数调用，改用指标标签和$value展示
          description: "当前打开文件数{{ $value | humanize }}，占最大限制的50%以上，可能导致新连接无法创建"
          suggestion: "通过`kubectl exec <pod名> -n <命名空间> -- lsof -p <进程PID>`查看打开的文件句柄"

      # 5. 非自愿上下文切换激增
      - alert: ProcessGroupNonVoluntaryCtxSwitchSurge
        expr: |
          rate(namedprocess_namegroup_context_switches_total{ctxswitchtype="nonvoluntary"}[5m]) > 1000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.groupname }} 非自愿上下文切换激增"
          description: "5分钟内非自愿切换速率{{ $value | humanize }}次/秒，CPU竞争激烈"
          suggestion: "检查节点是否有其他高CPU进程（如`kubectl top node`）"

      # 6. 主要页面错误增加
      - alert: ProcessGroupMajorPageFaultsIncreased
        expr: |
          rate(namedprocess_namegroup_major_page_faults_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.groupname }} 主要页面错误新增"
          description: "5分钟内新增{{ $value | humanize }}次主要页面错误，物理内存不足"
          suggestion: "增加节点内存或限制进程内存（如设置Pod的resources.limits.memory）"

      # 7. 进程数异常
      - alert: ProcessGroupAbnormalNumProcs
        expr: |
          (namedprocess_namegroup_num_procs{groupname=~"alertmanager|kube-apiserver|kube-controller-manager|prometheus-server"} != 1)
          or
          (namedprocess_namegroup_num_procs{groupname="kube-scheduler"} != 2)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.groupname }} 进程数异常"
          # 修复：将单引号改为双引号（Go模板中字符串需用双引号）
          description: "当前进程数{{ $value }}，预期为{{ if eq $labels.groupname \"kube-scheduler\" }}2{{ else }}1{{ end }}，可能进程崩溃或多实例冲突"
          suggestion: "查看进程日志：`kubectl logs <pod名> -n <命名空间>`"

      # 8. 进程未运行
      - alert: ProcessGroupNotRunning
        expr: |
          namedprocess_namegroup_num_procs == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.groupname }} 进程未运行"
          description: "当前进程数为0，服务已中断，需立即重启"
          suggestion: "重启Pod：`kubectl delete pod <pod名> -n <命名空间>`（依赖Deployment自动重建）"

